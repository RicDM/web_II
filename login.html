<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Alugue Aqui - Marketplace de imoveis</title>
        <meta content="width=device-width, initial-scale=1.0" name="viewport">
        <meta content="" name="keywords">
        <meta content="" name="description">

        <!-- Favicon -->
        <link href="img/favicon.ico" rel="icon">

        <!-- Stylesheet -->
        <link href="css/styleLogin.css" rel="stylesheet">
    </head>
    <body>
        <div class="wrapper login-1">
            <div class="container">
                <div class="col-left">
                    <div class="login-text">
                        <h2>Bem Vindo de volta</h2>
                        <p>Crie sua conta.<br>É totalmente gratis.</p>
                        <a class="btn" href="">Cadastre-se</a>
                    </div>
                </div>
                <div class="col-right">
                    <div class="login-form">
                        <h2>Login</h2>
                        <form>
                            <p>
                                <label>Endereço de E-mail<span>*</span></label>
                                <input type="text" placeholder="Digite seu Email" required>
                            </p>
                            <p>
                                <label>Senha<span>*</span></label>
                                <input type="password" placeholder="Digite sua Senha" required>
                            </p>
                            <p>
                                <input type="submit" value="Entrar" />
                            </p>
                            <p>
                                <a href="">Esqueçeu sua senha?</a>
                            </p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <script src="js/login.js"></script>
    </body>
</html>
